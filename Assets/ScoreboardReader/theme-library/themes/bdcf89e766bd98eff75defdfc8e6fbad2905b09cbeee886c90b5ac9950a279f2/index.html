  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">

"image-slot\" from=\"023d5507-6ab1-4b32-a51f-028e99f73163#/image-slot.js\" id=\"logo1\" shape=\"rect\" fit=\"contain\" placeholder=\"Team 1 logo\" hint-size=\"170px,140px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"position:relative; z-index:2; display:flex; align-items:baseline; gap:11px; padding:7px 11px 0\">\n        <span style=\"font-size:33px; font-weight:bold; color:rgba(215,225,230,0.75); text-shadow:0 2px 2px rgba(0,0,0,0.5)\">{{ team1RankText }}<\u002Fspan>\n        <span style=\"font-size:42px; font-weight:bold; color:#f2f4f2; letter-spacing:-0.01em; text-shadow:0 2px 3px rgba(0,0,0,0.55); white-space:nowrap\">{{ team1Name }}<\u002Fspan>\n        <span style=\"margin-left:auto; font-size:32px; font-weight:bold; color:rgba(225,232,235,0.85); text-shadow:0 2px 2px rgba(0,0,0,0.5)\">{{ team1Record }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:15px; padding:2px 12px 0\">\n        <sc-for list=\"{{ team1Timeouts }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <span style=\"width:30px; height:6px; border-radius:2px; background:#dfe8cf; box-shadow:0 1px 2px rgba(0,0,0,0.4); opacity:{{ t.op }}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; align-items:flex-end; gap:12px; padding:0 11px 2px\">\n        <span style=\"display:inline-block; overflow:hidden\">{{ score1El }}<\u002Fspan>\n        <sc-if value=\"{{ poss1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"width:0; height:0; border-top:14px solid transparent; border-bottom:14px solid transparent; border-right:21px solid #f5f7f5; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.5)); align-self:center\"><\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Team 2 panel -->\n    <div style=\"position:relative; height:152px; background:{{ team2Bg }}; box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -2px 4px rgba(0,0,0,0.3); overflow:hidden; border-bottom:4px solid #15170f\">\n      <div style=\"position:absolute; left:0; right:120px; top:62px; bottom:0; background:rgba(0,0,0,0.26)\"><\u002Fdiv>\n      <div style=\"position:absolute; left:0; right:120px; top:62px; bottom:0; background:radial-gradient(circle at center, rgba(255,255,255,0.24) 1px, transparent 1.5px); background-size:6px 6px; -webkit-mask-image:linear-gradient(90deg, transparent, rgba(0,0,0,0.9)); mask-image:linear-gradient(90deg, transparent, rgba(0,0,0,0.9))\"><\u002Fdiv>\n      <div style=\"position:absolute; right:2px; top:62px; bottom:4px; width:118px; z-index:1\">\n        <x-import component-from-global-scope=\"image-slot\" from=\"023d5507-6ab1-4b32-a51f-028e99f73163#/image-slot.js\" id=\"logo2b\" shape=\"rect\" fit=\"contain\" placeholder=\"Team 2 logo\" hint-size=\"170px,136px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"position:relative; z-index:2; display:flex; align-items:baseline; gap:11px; padding:7px 11px 0\">\n        <span style=\"font-size:33px; font-weight:bold; color:rgba(255,240,220,0.8); text-shadow:0 2px 2px rgba(0,0,0,0.4)\">{{ team2RankText }}<\u002Fspan>\n        <span style=\"font-size:42px; font-weight:bold; color:#fdf6ee; letter-spacing:-0.01em; text-shadow:0 2px 3px rgba(0,0,0,0.45); white-space:nowrap\">{{ team2Name }}<\u002Fspan>\n        <span style=\"margin-left:auto; font-size:32px; font-weight:bold; color:rgba(255,245,230,0.9); text-shadow:0 2px 2px rgba(0,0,0,0.4)\">{{ team2Record }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:15px; padding:2px 12px 0\">\n        <sc-for list=\"{{ team2Timeouts }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <span style=\"width:30px; height:6px; border-radius:2px; background:#f4e3b2; box-shadow:0 1px 2px rgba(0,0,0,0.35); opacity:{{ t.op }}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; align-items:flex-end; gap:12px; padding:0 11px 2px\">\n        <span style=\"display:inline-block; overflow:hidden\">{{ score2El }}<\u002Fspan>\n        <sc-if value=\"{{ poss2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"width:0; height:0; border-top:14px solid transparent; border-bottom:14px solid transparent; border-right:21px solid #fdf7ef; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.4)); align-self:center\"><\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Info row: quarter | clock | play clock -->\n    <div style=\"display:grid; grid-template-columns:1.25fr 1.15fr 1.1fr; height:56px; background:linear-gradient(180deg,#f4f2e8,#e9e7db); box-shadow:inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -1px 2px rgba(0,0,0,0.2); align-items:center; border-bottom:4px solid #15170f\">\n      <div style=\"font-size:47px; font-weight:bold; color:#33352f; text-align:center; line-height:1\">{{ quarterText }}<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ toggleClock }}\" title=\"Click to start/stop clock\" style=\"font-size:47px; font-weight:bold; color:#33352f; text-align:center; border-left:3px solid #8f938a; border-right:3px solid #8f938a; align-self:stretch; display:flex; align-items:center; justify-content:center; cursor:pointer; font-variant-numeric:tabular-nums; line-height:1\">{{ clockText }}<\u002Fdiv>\n      <div style=\"font-size:47px; font-weight:bold; text-align:center; font-variant-numeric:tabular-nums; line-height:1; color:{{ playClockColor }}\">{{ playClock }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Down & distance row -->\n    <div style=\"height:54px; background:linear-gradient(180deg,#f4f2e8,#e9e7db); box-shadow:inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -1px 2px rgba(0,0,0,0.2); display:flex; align-items:center; border-top:3px solid #8f938a\">\n      <span style=\"font-size:47px; font-weight:bold; color:#2e302a; padding-left:12px\">{{ downText }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CONTROL PANEL -->\n  <img src=\"4d02fac9-6f8c-468b-a512-1157fd8b06e4\" alt=\"Reference scorebug\" style=\"width: 405px; height: 489px; border-radius: 4px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); position: absolute; left: 1238px; top: 232px\"><div style=\"width:560px; max-width:92vw; background:#2c3023; border:1px solid #4a4f38; border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:12px; color:#eee\">\n    <div style=\"font-size:12px; font-weight:bold; letter-spacing:0.12em; text-transform:uppercase; color:#a9ad97\">Game Controls<\u002Fdiv>\n    <div style=\"display:flex; gap:20px; flex-wrap:wrap\">\n      <div style=\"flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px\">\n        <div style=\"font-size:13px; font-weight:bold; color:#d7dbc7\">{{ team1Name }}<\u002Fdiv>\n        <div style=\"display:flex; gap:6px\">\n          <button sc-camel-on-click=\"{{ add1_1 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+1<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add1_3 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+3<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add1_6 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+6<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add1_7 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+7<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:6px\">\n          <button sc-camel-on-click=\"{{ possTo1 }}\" style=\"flex:1.4; padding:8px 0; border:none; border-radius:6px; background:{{ poss1BtnBg }}; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Possession<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ timeout1 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">TO ({{ to1 }})<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px\">\n        <div style=\"font-size:13px; font-weight:bold; color:#d7dbc7\">{{ team2Name }}<\u002Fdiv>\n        <div style=\"display:flex; gap:6px\">\n          <button sc-camel-on-click=\"{{ add2_1 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+1<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add2_3 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+3<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add2_6 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+6<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ add2_7 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+7<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:6px\">\n          <button sc-camel-on-click=\"{{ possTo2 }}\" style=\"flex:1.4; padding:8px 0; border:none; border-radius:6px; background:{{ poss2BtnBg }}; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Possession<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ timeout2 }}\" style=\"flex:1; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">TO ({{ to2 }})<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:8px; flex-wrap:wrap; align-items:center\">\n      <button sc-camel-on-click=\"{{ toggleClock }}\" style=\"padding:8px 16px; border:none; border-radius:6px; background:#4c7a45; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">{{ clockBtnLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetPlayClock }}\" style=\"padding:8px 16px; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Play clock ↺<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ nextQuarter }}\" style=\"padding:8px 16px; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Next quarter<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetClock }}\" style=\"padding:8px 16px; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Clock 15:00<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:8px; flex-wrap:wrap; align-items:center\">\n      <span style=\"font-size:13px; font-weight:bold; color:#c3c7b2\">Down:<\u002Fspan>\n      <button sc-camel-on-click=\"{{ nextDown }}\" style=\"padding:8px 14px; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">Next down<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ firstDown }}\" style=\"padding:8px 14px; border:none; border-radius:6px; background:#e9e7db; color:#33352f; font-weight:bold; cursor:pointer; font-family:inherit\">1st &amp; 10<\u002Fbutton>\n      <span style=\"font-size:13px; font-weight:bold; color:#c3c7b2; margin-left:8px\">Distance:<\u002Fspan>\n      <button sc-camel-on-click=\"{{ distMinus }}\" style=\"width:36px; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">−<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ distPlus }}\" style=\"width:36px; padding:8px 0; border:none; border-radius:6px; background:#454b34; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit\">+<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:12px; color:#9a9e8a\">Team names, ranks, records &amp; colors are in the Tweaks panel. Drop team logos onto the logo squares.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;team1Name&quot;: {&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Notre Dame&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Top team&quot;},\n  &quot;team1Rank&quot;: {&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:25,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Top team&quot;},\n  &quot;team1Record&quot;: {&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8-1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Top team&quot;},\n  &quot;team1Color&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1c2c38&quot;,&quot;options&quot;:[&quot;#1c2c38&quot;,&quot;#7a0019&quot;,&quot;#154734&quot;,&quot;#4b306a&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Top team&quot;},\n  &quot;team2Name&quot;: {&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Miami&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bottom team&quot;},\n  &quot;team2Rank&quot;: {&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:25,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Bottom team&quot;},\n  &quot;team2Record&quot;: {&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8-0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bottom team&quot;},\n  &quot;team2Color&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d2691e&quot;,&quot;options&quot;:[&quot;#d2691e&quot;,&quot;#00274c&quot;,&quot;#841617&quot;,&quot;#046a38&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bottom team&quot;},\n  &quot;playClockLength&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:40,&quot;options&quot;:[40,25],&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    score1: 0, score2: 7,\n    poss: 1,\n    quarter: 1,\n    clock: 203,\n    running: false,\n    playClock: 14,\n    down: 3, dist: 6,\n    to1: 3, to2: 3,\n  };\n  componentDidMount() {\n    this.timer = setInterval(() => {\n      if (!this.state.running) return;\n      this.setState(s => ({\n        clock: Math.max(0, s.clock - 1),\n        playClock: Math.max(0, s.playClock - 1),\n        running: s.clock - 1 > 0,\n      }));\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    const s = this.state, p = this.props;\n    const t1 = p.team1Name ?? 'Notre Dame', t2 = p.team2Name ?? 'Miami';\n    const r1 = p.team1Rank ?? 3, r2 = p.team2Rank ?? 7;\n    const c1 = p.team1Color ?? '#1c2c38', c2 = p.team2Color ?? '#d2691e';\n    const ord = ['','1st','2nd','3rd','4th'];\n    const mm = Math.floor(s.clock / 60), ss = String(s.clock % 60).padStart(2, '0');\n    const add = (team, n) => () => this.setState(st => team === 1 ? { score1: st.score1 + n } : { score2: st.score2 + n });\n    const tos = n => [0,1,2].map(i => ({ op: i < n ? 1 : 0.18 }));\n    return {\n      team1Name: t1, team2Name: t2,\n      team1RankText: r1 > 0 ? String(r1) : '',\n      team2RankText: r2 > 0 ? String(r2) : '',\n      team1Record: p.team1Record ?? '8-1',\n      team2Record: p.team2Record ?? '8-0',\n      team1Bg: `linear-gradient(170deg, oklch(from ${c1} calc(l + 0.14) c h) 0%, ${c1} 45%, oklch(from ${c1} calc(l - 0.05) c h) 100%)`,\n      team2Bg: `linear-gradient(160deg, oklch(from ${c2} calc(l + 0.12) calc(c + 0.02) h) 0%, ${c2} 55%, oklch(from ${c2} calc(l - 0.06) c h) 100%)`,\n      team1Timeouts: tos(s.to1), team2Timeouts: tos(s.to2),\n      to1: s.to1, to2: s.to2,\n      score1: s.score1, score2: s.score2,\n      score1El: React.createElement('span', {\n        key: s.score1,\n        style: { display:'inline-block', fontSize:'88px', fontWeight:'bold', color:'#f5f7f5', lineHeight:0.92, textShadow:'0 3px 4px rgba(0,0,0,0.55)', fontVariantNumeric:'tabular-nums', animation:'scorePop 0.45s cubic-bezier(0.22,1.2,0.36,1) both' }\n      }, s.score1),\n      score2El: React.createElement('span', {\n        key: s.score2,\n        style: { display:'inline-block', fontSize:'88px', fontWeight:'bold', color:'#fdf7ef', lineHeight:0.92, textShadow:'0 3px 4px rgba(0,0,0,0.5)', fontVariantNumeric:'tabular-nums', animation:'scorePop 0.45s cubic-bezier(0.22,1.2,0.36,1) both' }\n      }, s.score2),\n      poss1: s.poss === 1, poss2: s.poss === 2,\n      quarterText: s.quarter <= 4 ? ord[s.quarter] : 'OT' + (s.quarter > 5 ? s.quarter - 4 : ''),\n      clockText: `${mm}:${ss}`,\n      playClock: s.playClock,\n      playClockColor: s.playClock <= 15 ? '#8e2f3a' : '#33352f',\n      downText: `${ord[Math.min(s.down,4)]} & ${s.dist === 0 ? 'Goal' : s.dist}`,\n      clockBtnLabel: s.running ? '⏸ Stop clock' : '▶ Start clock',\n      poss1BtnBg: s.poss === 1 ? '#4c7a45' : '#454b34',\n      poss2BtnBg: s.poss === 2 ? '#4c7a45' : '#454b34',\n      add1_1: add(1,1), add1_3: add(1,3), add1_6: add(1,6), add1_7: add(1,7),\n      add2_1: add(2,1), add2_3: add(2,3), add2_6: add(2,6), add2_7: add(2,7),\n      possTo1: () => this.setState({ poss: 1 }),\n      possTo2: () => this.setState({ poss: 2 }),\n      timeout1: () => this.setState(st => ({ to1: Math.max(0, st.to1 - 1), running: false })),\n      timeout2: () => this.setState(st => ({ to2: Math.max(0, st.to2 - 1), running: false })),\n      toggleClock: () => this.setState(st => ({ running: !st.running && st.clock > 0 })),\n      resetClock: () => this.setState({ clock: 900, running: false }),\n      resetPlayClock: () => this.setState({ playClock: p.playClockLength ?? 40 }),\n      nextQuarter: () => this.setState(st => ({ quarter: st.quarter + 1, clock: 900, running: false, playClock: p.playClockLength ?? 40, to1: st.quarter === 2 ? 3 : st.to1, to2: st.quarter === 2 ? 3 : st.to2 })),\n      nextDown: () => this.setState(st => ({ down: st.down >= 4 ? 1 : st.down + 1, dist: st.down >= 4 ? 10 : st.dist })),\n      firstDown: () => this.setState({ down: 1, dist: 10, playClock: p.playClockLength ?? 40 }),\n      distMinus: () => this.setState(st => ({ dist: Math.max(0, st.dist - 1) })),\n      distPlus: () => this.setState(st => ({ dist: st.dist + 1 })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
