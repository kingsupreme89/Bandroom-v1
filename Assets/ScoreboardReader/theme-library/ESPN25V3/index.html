* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:visible; background:transparent; }
html.chroma, body.chroma { background:#00FF00 !important; }
html.transparent, body.transparent { background:transparent !important; }
html.touchdown-active, body.touchdown-active { overflow:visible !important; }
body { font-family:'Archivo',sans-serif; font-weight:900; -webkit-font-smoothing:antialiased; }
:root {
  --away:#081148; --home:#e07d05; --away-text:#f6f3ef; --home-text:#f6f3ef;
}
#stage { position:absolute; left:0; top:0; width:1555px; height:176px; transform-origin:0 0; overflow:visible; background:transparent; }
#bug {
  position:absolute; left:0; top:14px; width:1555px; height:162px;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.5));
  transform-origin:center center;
  transition:transform 780ms cubic-bezier(.22,.70,.18,1);
  will-change:transform;
}
#bug.td-shift-away { transform:scale(0.40); transform-origin:right center; }
#bug.td-shift-home { transform:scale(0.40); transform-origin:left center; }

/* ── Top team strip ── */
.strip { position:absolute; left:0; top:0; width:100%; height:48px; border-radius:12px 12px 0 0; overflow:hidden; display:flex; box-shadow:inset 0 0 0 2px rgba(0,0,0,.35); }
.team-main { font-family:"Swis721-Condensed", "Swis721 Blk BT Condensed", sans-serif;  position:relative; flex:1; display:flex; align-items:center; font-weight:900; font-size:31px; letter-spacing:1.5px; }
.away-main { padding-left:30px; background:var(--away); box-shadow:inset 0 2px 0 rgba(255,255,255,.12); color:var(--away-text,#fff); text-shadow:0 2px 2px rgba(0,0,0,.6); }
.home-main { justify-content:flex-end; gap:14px; padding-right:30px; background:var(--home); box-shadow:inset 0 2px 0 rgba(255,255,255,.2); color:var(--home-text,#fff); text-shadow:0 2px 2px rgba(0,0,0,.45); }
.team-main::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,#232323,#121212 60%,#0b0b0b); box-shadow:inset 0 2px 0 rgba(255,255,255,.1); opacity:0; transition:opacity 220ms ease; }
#bug[data-possession="home"] .away-main::before, #bug[data-possession="none"] .away-main::before { opacity:1; }
#bug[data-possession="away"] .home-main::before, #bug[data-possession="none"] .home-main::before { opacity:1; }
.team-main > * { position:relative; z-index:1; }
.team-main .rank { font-family:"Swis721-Condensed-Rank", "Swis721 Cn BT", "Swis721-Condensed", sans-serif;  font-size:26px; text-shadow:0 2px 2px rgba(0,0,0,.45); }
.away-main .rank { font-family:"Swis721-Condensed-Rank", "Swis721 Cn BT", "Swis721-Condensed", sans-serif;  margin-right:14px; }

function norm(v){return String(v==null?'':v).toLowerCase().replace(/[^a-z0-9]/g,'')}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function truthy(v){if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;return /^(true|1|yes|on|away|home|visitor|a|h)$/i.test(String(v||'').trim())}
function hex(v,fallback){var s=String(v||'').trim(),m=/^#?([0-9a-f]{6})$/i.exec(s);return m?'#'+m[1].toLowerCase():fallback}
function rgb(h){h=hex(h,'#8c1230').slice(1);return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

        if(span)span.textContent=String(F.awayName||'AWAY').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0]}).join('').toUpperCase().slice(0,3)||'A';

  var view=ensureDownDistanceStructure();if(!view)return;
  if(downAnim.targetText===newText)return;
  stopDownAnimation(true);
  var token=downAnim.token,current=view.querySelector('.down-distance-current');
  if(!current){setDownDistanceImmediate(newText);return}
  downAnim.targetText=newText;
  var incoming=document.createElement('span');
  incoming.className='down-distance-slot down-distance-next';incoming.textContent=newText;
  incoming.style.transform='translate3d(30px,0,0)';incoming.style.opacity='0';view.appendChild(incoming);view.classList.add('down-animating');
  if(current.animate){
    downAnim.animations=[
      current.animate([{transform:'translate3d(0,0,0)',opacity:1},{transform:'translate3d(-30px,0,0)',opacity:0}],{duration:DOWN_DISTANCE_SLIDE_MS,easing:'cubic-bezier(.22,.70,.18,1)',fill:'forwards'}),
      incoming.animate([{transform:'translate3d(30px,0,0)',opacity:0},{transform:'translate3d(0,0,0)',opacity:1}],{duration:DOWN_DISTANCE_SLIDE_MS,easing:'cubic-bezier(.22,.70,.18,1)',fill:'forwards'})
    ]
  }else{
    current.style.transition='transform '+DOWN_DISTANCE_SLIDE_MS+'ms cubic-bezier(.22,.70,.18,1),opacity '+DOWN_DISTANCE_SLIDE_MS+'ms ease';
    incoming.style.transition='transform '+DOWN_DISTANCE_SLIDE_MS+'ms cubic-bezier(.22,.70,.18,1),opacity '+DOWN_DISTANCE_SLIDE_MS+'ms ease';
    requestAnimationFrame(function(){requestAnimationFrame(function(){if(token!==downAnim.token)return;current.style.transform='translate3d(-30px,0,0)';current.style.opacity='0';incoming.style.transform='translate3d(0,0,0)';incoming.style.opacity='1'})})
  }
  downAnim.finishTimer=setTimeout(function(){
    if(token!==downAnim.token)return;
    if(current&&current.parentNode)current.parentNode.removeChild(current);
    incoming.className='down-distance-slot down-distance-current';incoming.style.transform='translate3d(0,0,0)';incoming.style.opacity='1';incoming.style.transition='';
    downAnim.currentText=newText;downAnim.currentDown=extractDownKey(newText);downAnim.targetText=null;view.classList.remove('down-animating');downAnim.finishTimer=0;downAnim.animations=[];
    var pending=downAnim.pendingText;downAnim.pendingText=null;
    if(pending&&pending!==downAnim.currentText){var pendingDown=extractDownKey(pending);if(pendingDown&&downAnim.currentDown&&pendingDown!==downAnim.currentDown)animateDownDistance(pending);else setDownDistanceImmediate(pending)}

}
function renderDownDistance(){
  var newText=combinedSituation(),newDown=extractDownKey(newText);ensureDownDistanceStructure();

  if(downAnim.targetText){if(newText===downAnim.targetText)return;if(newText!==downAnim.currentText)downAnim.pendingText=newText;return}

function setField(field,value){
  if(!(field in F))return false;
  if(field==='awayTimeouts'||field==='homeTimeouts'){var c=timeoutCount(value);if(c==null)return false;value=c}
  else if(field==='awayPossession'||field==='homePossession')value=truthy(value);
  else if(field==='awayColor'||field==='homeColor')value=hex(value,F[field]);
  else value=String(value==null?'':value).trim();
  if(String(F[field])===String(value))return false;
  F[field]=value;return true
}

function flatten(obj,out,path,depth){
  out=out||{};path=path||[];depth=depth||0;
  if(!obj||typeof obj!=='object'||depth>5)return out;
  Object.keys(obj).forEach(function(k){
    var v=obj[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Node)){flatten(v,out,path.concat([k]),depth+1);return}
    var nk=norm(k),joined=norm(path.concat([k]).join('.')),field=FIELD[joined]||FIELD[nk]||null;
    var parent=path.length?norm(path[path.length-1]):'';
    var side=(parent==='away'||parent==='visitor'||parent==='team1'||parent==='teama'||parent==='left')?'away':(parent==='home'||parent==='team2'||parent==='teamb'||parent==='right')?'home':null;
    if(side&&TEAM_LEAF[nk])field=side+TEAM_LEAF[nk];
    if((parent==='game'||parent==='scoreboard'||parent==='match')&&GAME_LEAF[nk])field=GAME_LEAF[nk];
    if(field)out[field]=v
  });
  return out
}

function harvest(){
  var changed=false;
  Object.keys(BINDINGS).forEach(function(id){
    var field=BINDINGS[id],v=readBinding($(id),field);
    if(String(v)===String(seen[id]))return;
    seen[id]=v;
    if((v!==''||field==='manualAwayRecord'||field==='manualHomeRecord'||field==='penaltyTeam')&&setField(field,v))changed=true
  });
  Object.keys(LEGACY).forEach(function(id){
    var el=$(id),field=LEGACY[id],v=readBinding(el,field);
    if(!v||String(v)===String(legacySeen[id]))return;
    legacySeen[id]=v;
    if(setField(field,v))changed=true

  if(changed)scheduleRender()
}
