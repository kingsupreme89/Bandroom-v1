document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-face {\n  font-family: 'Saira Condensed';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"94977a03-5b41-44a2-9c9a-0a660403f2e8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\nhtml, body {\n  margin: 0; padding: 0; overflow: hidden;\n  width: 100%; height: 100%;\n  min-width: 1920px; min-height: 146px;\n  background: transparent;\n}\nbody[data-key=\"green\"], html[data-key=\"green\"] { background: #00FF00 !important; }\n#backdrop { position: fixed; left: -50vw; top: -50vh; width: 200vw; height: 200vh; background: #00FF00; z-index: 0; display: none; }\nbody[data-key=\"green\"] #backdrop { display: block; }\nbody { -webkit-font-smoothing: antialiased; }\n\n#bug {\n  position: absolute; left: 0; top: 0; z-index: 1;\n  width: 1896px; height: 144px;          /* artwork size; scaled to the canvas in JS */\n  transform-origin: 0 0;\n  background: transparent;\n  --away: #7a1120;\n  --home: #0d2a5c;\n  --soft: 1.7px;\n  --cond: 'Saira Condensed', 'Arial Narrow', Arial, sans-serif;\n}\n\n/* the plate: one piece of artwork, nothing drawn over its edges */\n#plate { position: absolute; left: 0; top: 0; width: 1896px; height: 144px; pointer-events: none; z-index: 1; }\n\n/* team colour plates — bound, tinted, never stripped of their artwork */\n/* The app owns these and may write inline backgrounds/text with !important —\n   display:none is the one thing an inline write can't paint through. */\n.panel { display: none !important; position: absolute; top: 38px; height: 52px; z-index: 2; background: none !important; overflow: hidden;\n         color: transparent !important; font-size: 0 !important; line-height: 0 !important; }\n.panel > i { display: none; }\n#awayPanel { left: 281px; width: 294px; }\n#homePanel { left: 686px; width: 296px; }\n#awayPanel > i { background: var(--away) !important; }\n#homePanel > i { background: var(--home) !important; }\n\n/* live text cells */\n.cell { position: absolute; top: 40px; height: 50px; z-index: 3;\n        display: flex; align-items: center; justify-content: center;\n        font-family: var(--cond); font-weight: 800; color: #f7f3e8;\n        line-height: 1; white-space: nowrap; overflow: hidden;\n        filter: blur(var(--soft)); }\n.cell > * { flex: 0 0 auto; }\n.ident { gap: 10px; }\n#awayIdent { left: 281px; width: 294px; }\n#homeIdent { left: 686px; width: 296px; }\n.rank { font-size: 42px; }\n.name { font-size: 50px; letter-spacing: .01em; }\n\n.scoreCell { top: 41px; color: #1b1a18; font-size: 50px; }\n#awayScoreBox { left: 579px; width: 101px; }\n#homeScoreBox { left: 987px; width: 101px; }\n\n#quarterBox   { left: 1106px; width: 109px; font-size: 44px; }\n#clockBox     { left: 1245px; width: 145px; font-size: 50px; }\n#playClockBox { left: 1417px; width: 84px;  font-size: 44px; color: #b09140; }\n#ddBox        { left: 1535px; width: 258px; font-size: 46px; }\n\n/* possession: geometry locked, toggled by opacity only, never removed */\n.poss {\n  position: relative !important; display: block !important;\n  width: 0 !important; height: 0 !important;\n  border-left: 17px solid #f7f3e8 !important;\n  border-top: 11px solid transparent !important;\n  border-bottom: 11px solid transparent !important;\n  background: none !important; font-size: 0 !important; color: transparent !important;\n  overflow: hidden !important; opacity: 0;\n}\n.poss > * { display: none !important; }\n\n/* timeouts: three slanted dashes, used ones dim out */\n.to { position: absolute; top: 90px; height: 16px; z-index: 4; display: flex; filter: blur(var(--soft));\n      font-size: 0 !important; color: transparent !important; background: none !important; }\n#awayTimeoutMarks { left: 324px; }\n#homeTimeoutMarks { left: 736px; }\n.to s { display: block; width: 56px; height: 16px; text-decoration: none;\n        background: linear-gradient(180deg, #8b7a4b 0%, #d9ca8b 13%, #f2e589 32%, #f4ea7c 55%, #ede382 72%, #c0b76b 86%, #6f6730 100%);\n        transform: skewX(-38deg); }\n#awayTimeoutMarks s + s { margin-left: 10px; }\n#homeTimeoutMarks s + s { margin-left: 11px; }\n\n/* the host writes here; it is never on screen */\n.srcText { position: absolute !important; left: -99999px !important; top: 0 !important;\n           width: 1px !important; height: 1px !important; overflow: hidden !important; opacity: 0 !important; }\n\n/* ---------- edit panel (below the 146px canvas, so a cropped OBS source never shows it) ---------- */\n#editor { position: absolute; left: 0; top: 158px; width: 1900px; z-index: 50;\n          font: 12px/1.4 -apple-system, \"Segoe UI\", Roboto, sans-serif; color: #e8e8e8;\n          background: #16181c; border: 1px solid #2c3038; padding: 12px 14px 14px; box-sizing: border-box; }\n#editor[hidden] { display: none; }\n#editor h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7f8797; font-weight: 600; }\n#editor .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }\n#editor .grid { display: grid; grid-template-columns: 92px 1fr; gap: 6px 8px; align-items: center; }\n#editor label { color: #9aa3b2; }\n#editor input[type=text], #editor input[type=number], #editor select {\n  width: 100%; box-sizing: border-box; background: #0e1013; color: #f2f2f2;\n  border: 1px solid #333844; padding: 4px 6px; font: 12px/1.3 inherit; }\n#editor input[type=color] { width: 42px; height: 24px; padding: 0; background: #0e1013; border: 1px solid #333844; }\n#editor input[type=range] { width: 100%; }\n#editor input:focus { outline: none; border-color: #5b86ff; }\n#editor .row { display: flex; align-items: center; gap: 10px; }\n#editor .foot { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #24282f; flex-wrap: wrap; }\n#editor button { background: #262c36; color: #e8e8e8; border: 1px solid #3a4150; padding: 5px 11px; font: 12px inherit; cursor: pointer; }\n#editor button:hover { background: #303845; }\n#editor code { color: #cfd6e2; background: #0e1013; padding: 1px 4px; }\n#editor .note { color: #6f7787; }\n\n#diag { position: fixed; left: 0; top: 158px; width: 1900px; max-height: 700px; overflow: hidden; z-index: 99;\n        font: 12px/1.35 Consolas, monospace; color: #baffba; background: #000; padding: 8px; white-space: pre-wrap; display: none; }\n\n/* offscreen binding targets */\n#bind { position: absolute; left: -99999px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body data-width=\"1920\" data-height=\"146\" data-cfb27-width=\"1920\" data-cfb27-height=\"146\" data-cfb27-canvas-width=\"1920\" data-cfb27-canvas-height=\"146\">\n\n\n\n<div id=\"backdrop\"><\u002Fdiv>\n<div id=\"diag\"><\u002Fdiv>\n\n<div id=\"bug\" data-cfb27-scorebug=\"\" data-cfb27-root=\"\">\n\n  <img id=\"plate\" src=\"0430e893-847d-48a8-87c8-f8122130e00a\" alt=\"\">\n\n  <div class=\"panel\" id=\"awayPanel\" data-cfb27-bind=\"away.color\" data-cfb27-field=\"awayPanel\" data-field=\"away-color\" data-bind=\"awayPanel\"><i><\u002Fi><\u002Fdiv>\n  <div class=\"panel\" id=\"homePanel\" data-cfb27-bind=\"home.color\" data-cfb27-field=\"homePanel\" data-field=\"home-color\" data-bind=\"homePanel\"><i><\u002Fi><\u002Fdiv>\n\n  <div class=\"cell ident\" id=\"awayIdent\">\n    <span class=\"poss\" id=\"awayPossession\" data-cfb27-bind=\"away.possession\" data-cfb27-field=\"awayPossession\" data-field=\"away-possession\" data-bind=\"awayPossession\"><\u002Fspan>\n    <span class=\"srcText\" id=\"awayRank\" data-cfb27-bind=\"away.rank\" data-cfb27-field=\"awayRank\" data-field=\"away-rank\" data-bind=\"awayRank\"><\u002Fspan>\n    <span class=\"srcText\" id=\"awayName\" data-cfb27-bind=\"away.name\" data-cfb27-field=\"awayName\" data-field=\"away-name\" data-bind=\"awayName\"><\u002Fspan>\n    <span class=\"rank\" id=\"awayRankView\"><\u002Fspan>\n    <span class=\"name\" id=\"awayNameView\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cell scoreCell\" id=\"awayScoreBox\">\n    <span class=\"srcText\" id=\"awayScore\" data-cfb27-bind=\"away.score\" data-cfb27-field=\"awayScore\" data-field=\"away-score\" data-bind=\"awayScore\"><\u002Fspan>\n    <span id=\"awayScoreView\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cell ident\" id=\"homeIdent\">\n    <span class=\"poss\" id=\"homePossession\" data-cfb27-bind=\"home.possession\" data-cfb27-field=\"homePossession\" data-field=\"home-possession\" data-bind=\"homePossession\"><\u002Fspan>\n    <span class=\"srcText\" id=\"homeRank\" data-cfb27-bind=\"home.rank\" data-cfb27-field=\"homeRank\" data-field=\"home-rank\" data-bind=\"homeRank\"><\u002Fspan>\n    <span class=\"srcText\" id=\"homeName\" data-cfb27-bind=\"home.name\" data-cfb27-field=\"homeName\" data-field=\"home-name\" data-bind=\"homeName\"><\u002Fspan>\n    <span class=\"rank\" id=\"homeRankView\"><\u002Fspan>\n    <span class=\"name\" id=\"homeNameView\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cell scoreCell\" id=\"homeScoreBox\">\n    <span class=\"srcText\" id=\"homeScore\" data-cfb27-bind=\"home.score\" data-cfb27-field=\"homeScore\" data-field=\"home-score\" data-bind=\"homeScore\"><\u002Fspan>\n    <span id=\"homeScoreView\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cell\" id=\"quarterBox\">\n    <span class=\"srcText\" id=\"quarter\" data-cfb27-bind=\"game.quarter\" data-cfb27-field=\"quarter\" data-field=\"quarter\" data-bind=\"quarter\"><\u002Fspan>\n    <span id=\"quarterView\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"cell\" id=\"clockBox\">\n    <span class=\"srcText\" id=\"clock\" data-cfb27-bind=\"game.clock\" data-cfb27-field=\"clock\" data-field=\"clock\" data-bind=\"clock\"><\u002Fspan>\n    <span id=\"clockView\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"cell\" id=\"playClockBox\">\n    <span class=\"srcText\" id=\"playClock\" data-cfb27-bind=\"game.playClock\" data-cfb27-field=\"playClock\" data-field=\"play-clock\" data-bind=\"playClock\"><\u002Fspan>\n    <span id=\"playClockView\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"cell\" id=\"ddBox\">\n    <span class=\"srcText\" id=\"downDistance\" data-cfb27-bind=\"game.downDistance\" data-cfb27-field=\"downDistance\" data-field=\"down-distance\" data-bind=\"downDistance\"><\u002Fspan>\n    <span id=\"downDistanceView\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"to\" id=\"awayTimeoutMarks\" data-cfb27-bind=\"away.timeouts\" data-cfb27-field=\"awayTimeoutMarks\" data-field=\"away-timeouts\" data-bind=\"awayTimeoutMarks\"><s><\u002Fs><s><\u002Fs><s><\u002Fs><\u002Fdiv>\n  <div class=\"to\" id=\"homeTimeoutMarks\" data-cfb27-bind=\"home.timeouts\" data-cfb27-field=\"homeTimeoutMarks\" data-field=\"home-timeouts\" data-bind=\"homeTimeoutMarks\"><s><\u002Fs><s><\u002Fs><s><\u002Fs><\u002Fdiv>\n\n  <!-- Absorbers: this bug doesn't show records, logos, or mascots, but the app\n       still binds and writes them. These give every one of those writes its own\n       offscreen element, so nothing lands in (or next to) the rank fields. -->\n  <span class=\"srcText\" id=\"awayRecord\" data-cfb27-bind=\"away.record\" data-cfb27-field=\"awayRecord\" data-field=\"away-record\" data-bind=\"awayRecord\"><\u002Fspan>\n  <span class=\"srcText\" id=\"homeRecord\" data-cfb27-bind=\"home.record\" data-cfb27-field=\"homeRecord\" data-field=\"home-record\" data-bind=\"homeRecord\"><\u002Fspan>\n  <img class=\"srcText\" id=\"awayLogo\" alt=\"\" data-cfb27-bind=\"away.logo\" data-cfb27-field=\"awayLogo\" data-field=\"away-logo\" data-bind=\"awayLogo\">\n  <img class=\"srcText\" id=\"homeLogo\" alt=\"\" data-cfb27-bind=\"home.logo\" data-cfb27-field=\"homeLogo\" data-field=\"home-logo\" data-bind=\"homeLogo\">\n  <img class=\"srcText\" id=\"awayMascot\" alt=\"\" data-cfb27-bind=\"away.mascot\" data-cfb27-field=\"awayMascot\" data-field=\"away-mascot\" data-bind=\"awayMascot\">\n  <img class=\"srcText\" id=\"awayMascot2\" alt=\"\" data-cfb27-bind=\"away.mascot2\" data-cfb27-field=\"awayMascot2\" data-field=\"away-mascot2\" data-bind=\"awayMascot2\">\n  <img class=\"srcText\" id=\"homeMascot\" alt=\"\" data-cfb27-bind=\"home.mascot\" data-cfb27-field=\"homeMascot\" data-field=\"home-mascot\" data-bind=\"homeMascot\">\n  <img class=\"srcText\" id=\"homeMascot2\" alt=\"\" data-cfb27-bind=\"home.mascot2\" data-cfb27-field=\"homeMascot2\" data-field=\"home-mascot2\" data-bind=\"homeMascot2\">\n<\u002Fdiv>\n\n<div id=\"editor\">\n  <div class=\"cols\">\n    <div>\n      <h4>Away (left)<\u002Fh4>\n      <div class=\"grid\">\n        <label for=\"ed_awayName\">Name<\u002Flabel><input type=\"text\" id=\"ed_awayName\">\n        <label for=\"ed_awayRank\">Rank<\u002Flabel><input type=\"text\" id=\"ed_awayRank\">\n        <label for=\"ed_awayScore\">Score<\u002Flabel><input type=\"text\" id=\"ed_awayScore\">\n        <label for=\"ed_awayTimeouts\">Timeouts<\u002Flabel><input type=\"number\" id=\"ed_awayTimeouts\" min=\"0\" max=\"3\" step=\"1\">\n        <label for=\"ed_awayColor\">Colour<\u002Flabel><div class=\"row\"><input type=\"color\" id=\"ed_awayColor\"><input type=\"text\" id=\"ed_awayColorHex\" placeholder=\"#RRGGBB\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h4>Home (right)<\u002Fh4>\n      <div class=\"grid\">\n        <label for=\"ed_homeName\">Name<\u002Flabel><input type=\"text\" id=\"ed_homeName\">\n        <label for=\"ed_homeRank\">Rank<\u002Flabel><input type=\"text\" id=\"ed_homeRank\">\n        <label for=\"ed_homeScore\">Score<\u002Flabel><input type=\"text\" id=\"ed_homeScore\">\n        <label for=\"ed_homeTimeouts\">Timeouts<\u002Flabel><input type=\"number\" id=\"ed_homeTimeouts\" min=\"0\" max=\"3\" step=\"1\">\n        <label for=\"ed_homeColor\">Colour<\u002Flabel><div class=\"row\"><input type=\"color\" id=\"ed_homeColor\"><input type=\"text\" id=\"ed_homeColorHex\" placeholder=\"#RRGGBB\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h4>Game<\u002Fh4>\n      <div class=\"grid\">\n        <label for=\"ed_quarter\">Quarter<\u002Flabel><input type=\"text\" id=\"ed_quarter\" placeholder=\"1-4 or OT\">\n        <label for=\"ed_clock\">Clock<\u002Flabel><input type=\"text\" id=\"ed_clock\" placeholder=\"5:21\">\n        <label for=\"ed_playClock\">Play clock<\u002Flabel><input type=\"text\" id=\"ed_playClock\" placeholder=\"10\">\n        <label for=\"ed_downDistance\">Down &amp; dist<\u002Flabel><input type=\"text\" id=\"ed_downDistance\" placeholder=\"1ST &amp; GOAL\">\n        <label for=\"ed_poss\">Possession<\u002Flabel>\n        <select id=\"ed_poss\"><option value=\"none\">none<\u002Foption><option value=\"away\">away<\u002Foption><option value=\"home\">home<\u002Foption><\u002Fselect>\n        <label for=\"ed_soft\">Softness<\u002Flabel><div class=\"row\"><input type=\"range\" id=\"ed_soft\" min=\"0\" max=\"3\" step=\"0.05\"><span id=\"ed_softVal\" class=\"note\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\">\n    <label class=\"row\"><input type=\"checkbox\" id=\"ed_abbr\" checked=\"\"> Abbreviate long names<\u002Flabel>\n    <label class=\"row\"><input type=\"checkbox\" id=\"ed_green\"> Green key background<\u002Flabel>\n    <button type=\"button\" id=\"ed_demo\">Load sample game<\u002Fbutton>\n    <button type=\"button\" id=\"ed_clear\">Clear all fields<\u002Fbutton>\n    <button type=\"button\" id=\"ed_hide\">Hide panel<\u002Fbutton>\n    <span class=\"note\">Below the 146px canvas — add <code>?live=1<\u002Fcode> to hide it, <code>?green=1<\u002Fcode> for the key, <code>?debug=1<\u002Fcode> for diagnostics.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Write text into any of these and the bug updates. Ignore them and nothing breaks. -->\n<div id=\"bind\" aria-hidden=\"true\">\n  <span id=\"away_name\"><\u002Fspan><span id=\"away-name\"><\u002Fspan><span id=\"awayTeam\"><\u002Fspan><span id=\"awayTeamName\"><\u002Fspan><span id=\"visitorName\"><\u002Fspan><span id=\"team1Name\"><\u002Fspan><span id=\"teamAName\"><\u002Fspan>\n  <span id=\"away_rank\"><\u002Fspan><span id=\"away-rank\"><\u002Fspan><span id=\"awayTeamRank\"><\u002Fspan><span id=\"team1Rank\"><\u002Fspan>\n  <span id=\"away_score\"><\u002Fspan><span id=\"away-score\"><\u002Fspan><span id=\"awayTeamScore\"><\u002Fspan><span id=\"team1Score\"><\u002Fspan><span id=\"visitorScore\"><\u002Fspan>\n  <span id=\"awayColor\"><\u002Fspan><span id=\"away_color\"><\u002Fspan><span id=\"away-color\"><\u002Fspan><span id=\"awayTeamColor\"><\u002Fspan><span id=\"team1Color\"><\u002Fspan>\n  <span id=\"away_possession\"><\u002Fspan><span id=\"away-possession\"><\u002Fspan><span id=\"awayPoss\"><\u002Fspan>\n  <span id=\"away_timeouts\"><\u002Fspan><span id=\"away-timeouts\"><\u002Fspan><span id=\"awayTO\"><\u002Fspan>\n  <span id=\"home_name\"><\u002Fspan><span id=\"home-name\"><\u002Fspan><span id=\"homeTeam\"><\u002Fspan><span id=\"homeTeamName\"><\u002Fspan><span id=\"team2Name\"><\u002Fspan><span id=\"teamBName\"><\u002Fspan>\n  <span id=\"home_rank\"><\u002Fspan><span id=\"home-rank\"><\u002Fspan><span id=\"homeTeamRank\"><\u002Fspan><span id=\"team2Rank\"><\u002Fspan>\n  <span id=\"home_score\"><\u002Fspan><span id=\"home-score\"><\u002Fspan><span id=\"homeTeamScore\"><\u002Fspan><span id=\"team2Score\"><\u002Fspan>\n  <span id=\"homeColor\"><\u002Fspan><span id=\"home_color\"><\u002Fspan><span id=\"home-color\"><\u002Fspan><span id=\"homeTeamColor\"><\u002Fspan><span id=\"team2Color\"><\u002Fspan>\n  <span id=\"home_possession\"><\u002Fspan><span id=\"home-possession\"><\u002Fspan><span id=\"homePoss\"><\u002Fspan>\n  <span id=\"home_timeouts\"><\u002Fspan><span id=\"home-timeouts\"><\u002Fspan><span id=\"homeTO\"><\u002Fspan>\n  <span id=\"possession\"><\u002Fspan>\n  <span id=\"period\"><\u002Fspan><span id=\"qtr\"><\u002Fspan><span id=\"quarter_text\"><\u002Fspan><span id=\"gameQuarter\"><\u002Fspan><span id=\"gamePeriod\"><\u002Fspan>\n  <span id=\"gameClock\"><\u002Fspan><span id=\"game_clock\"><\u002Fspan><span id=\"game-clock\"><\u002Fspan><span id=\"timeRemaining\"><\u002Fspan><span id=\"clockText\"><\u002Fspan>\n  <span id=\"play_clock\"><\u002Fspan><span id=\"play-clock\"><\u002Fspan><span id=\"playClockText\"><\u002Fspan><span id=\"shotClock\"><\u002Fspan>\n  <span id=\"down_distance\"><\u002Fspan><span id=\"down-distance\"><\u002Fspan><span id=\"downAndDistance\"><\u002Fspan><span id=\"situation\"><\u002Fspan>\n  <span id=\"down\"><\u002Fspan><span id=\"distance\"><\u002Fspan>\n<\u002Fdiv>\n\n<script>\n(function () {\n  'use strict';\n\n  var ART_W = 1896, ART_H = 144;\n  var CANVAS_W = 1920, CANVAS_H = 146;\n  var SCALE = CANVAS_W / ART_W;\n\n  var $ = function (id) { return document.getElementById(id); };\n\n  /* ---------------- state ---------------- */\n\n  var F = {\n    awayName: '', awayRank: '', awayColor: '#7a1120',\n    awayScore: '', awayPossession: false,\n    homeName: '', homeRank: '', homeColor: '#0d2a5c',\n    homeScore: '', homePossession: false,\n    awayTimeouts: 3, homeTimeouts: 3,\n    quarter: '', clock: '', playClock: '', down: '', distance: '', downDistance: '',\n    softness: 1.7\n  };\n\n  /* ---------------- alias table ---------------- */\n\n  var ALIAS = {};\n  function alias(field, ids) { ids.forEach(function (id) { ALIAS[id] = field; }); }\n\n  alias('awayName',       ['away_name','away-name','awayTeam','awayTeamName','visitorName','team1Name','teamAName']);\n  alias('awayRank',       ['away_rank','away-rank','awayTeamRank','team1Rank']);\n  alias('awayScore',      ['away_score','away-score','awayTeamScore','team1Score','visitorScore']);\n  alias('awayColor',      ['awayColor','away_color','away-color','awayTeamColor','team1Color']);\n  alias('awayPossession', ['away_possession','away-possession','awayPoss']);\n  alias('awayTimeouts',   ['a
