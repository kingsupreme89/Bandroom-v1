.slab {
  background: linear-gradient(180deg, #2b2b2b, #171717);
  box-shadow: inset 1px 0 0 rgba(255,255,255,.07), inset 0 0 12px rgba(0,0,0,.30);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
#slabQuarter  { flex: 0 0 106px; background: linear-gradient(180deg, #2b2a28, #31302e); }
#slabClock    { flex: 0 0 140px; background: linear-gradient(180deg, #414141, #161616); }
#slabPlayClock{ flex: 0 0 50px; background: linear-gradient(180deg, #1e2321, #292c29);
                box-shadow: inset 7px 0 6px -3px rgba(0,0,0,.85), inset -7px 0 6px -3px rgba(0,0,0,.85), inset 5px 0 0 0 #3a3d3a, inset -5px 0 0 0 #3a3d3a, inset 0 0 10px rgba(0,0,0,.30); }
#quarterView  { font: 900 32px/1 var(--black); color: #FFDE5E; letter-spacing: -.5px; white-space: nowrap; }
#clockView    { font: 900 42px/1 var(--black); color: #fff;    letter-spacing: -.5px;  white-space: nowrap; }
#playClockView{ font: 900 26px/1 var(--black); color: #FFDE5E; letter-spacing: -.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* down & distance plate */
#plate {
  position: relative; flex: 0 0 386px; background: #2d2d2d; box-sizing: border-box;
  padding: 7px 7px 8px; box-shadow: inset 1px 0 0 rgba(255,255,255,.06), inset 0 0 14px rgba(0,0,0,.45);
}
#plateFace {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: #e0e2dd;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 0 0 1px rgba(0,0,0,.35);
}
#plateFace b { position: absolute; width: 7px; height: 7px; background: #8a8c88; }
#plateText { position: absolute; left: 26px; right: 26px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#downDistanceView { flex: 0 0 auto; font: 900 41px/1 var(--black); color: #111; letter-spacing: -.5px; white-space: nowrap; }

/* flag announcement: both end-cap arrows blink yellow 3 times, then hold solid */
@keyframes flagBlink {
  0%, 14%   { filter: brightness(0); }
  15%, 29%  { filter: brightness(1); }
  30%, 44%  { filter: brightness(0); }
  45%, 59%  { filter: brightness(1); }
  60%, 74%  { filter: brightness(0); }
  75%, 100% { filter: brightness(1); }
}
.cap.flagCapOn > i { background: #FFDE00 !important; }
.cap.flagCapOn { animation: flagBlink 0.6s linear both; }
/* retraction: flash again, ending dark */
@keyframes flagBlinkOff {
  0%, 14%   { filter: brightness(1); }
  15%, 29%  { filter: brightness(0); }
  30%, 44%  { filter: brightness(1); }
  45%, 59%  { filter: brightness(0); }
  60%, 74%  { filter: brightness(1); }
  75%, 100% { filter: brightness(0); }
}
.cap.flagCapOff > i { background: #FFDE00 !important; }
.cap.flagCapOff { animation: flagBlinkOff 0.6s linear both; }
/* retraction: banners shrink away fast */
@keyframes penShrink { to { transform: scale(0); opacity: 0; } }
.penArrow.off { display: flex; animation: penSlideOut .3s cubic-bezier(.5,0,.8,1) both; }
@keyframes penSlideOut { to { transform: translateX(-110%); } }
#plateFlag.off { display: flex; transform-origin: center; animation: penShrink .28s cubic-bezier(.5,0,.8,1) both; }

/* flag underline: slides out from centre both ways, white pulse, settles yellow */
#underlineFlag {
  position: absolute; top: 69px; left: 34px; width: 1772px; height: 3px;
  background: #FFDE00; z-index: 7; display: none; transform-origin: center;
}
@keyframes flagLine {
  0%   { transform: scaleX(0); background: #FFDE00; }
  30%, 84% { transform: scaleX(1); background: #FFDE00; }
  88%, 92% { transform: scaleX(1); background: #fff2a8; }
  100% { transform: scaleX(1); background: #FFDE00; }
}
#underlineFlag.on { display: block; animation: flagLine 1.5s ease-out both; }
/* two white patches run from the centre to the ends over the yellow */
#underlineFlag::before, #underlineFlag::after {
  content: ''; position: absolute; top: 0; height: 100%; width: 90px;
  left: 50%; margin-left: -45px; opacity: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0));
}
#underlineFlag.on::before { animation: flagPulseL .6s ease-out .45s both; }
#underlineFlag.on::after  { animation: flagPulseR .6s ease-out .45s both; }
@keyframes flagPulseR { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(841px); opacity: 0; } }
@keyframes flagPulseL { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(-841px); opacity: 0; } }
@keyframes flagLineOut { to { transform: scaleX(0); } }
#underlineFlag.off { display: block; animation: flagLineOut .3s cubic-bezier(.5,0,.8,1) both; }

/* down & distance plate turns into a flashing yellow FLAG plate during a penalty */
#plateFlag {
  position: absolute; left: 7px; right: 7px; top: 7px; bottom: 8px;
  background: #FFDE00; z-index: 5;
  display: none; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
}
#plateFlag span { font: 900 41px/1 var(--black); color: #111; letter-spacing: -.5px; white-space: nowrap; }
#plateFlag b { position: absolute; width: 7px; height: 7px; background: #b3a000; }
#plateFlag.on { display: flex; animation: flagBlink 0.6s linear both; }

/* penalty callout: ONE yellow arrow slides out from the left over the flagged team's name */
.penArrow {
  position: absolute; left: 0; top: 0; bottom: 0; width: 300px;
  background: #FFDE00;
  clip-path: path('M0,0 L284,0 L297,30 Q300,36 297,42 L284,72 L0,72 Z');
  display: none; z-index: 4;
  align-items: center; justify-content: flex-end;
  padding-right: 44px; box-sizing: border-box;
}
.penArrow span { font: 900 30px/1 var(--black); color: #111; letter-spacing: -.5px; white-space: nowrap; }
.penArrow.on { display: flex; animation: penSlide .4s cubic-bezier(.25,.9,.3,1) both; }
@keyframes penSlide { from { transform: translateX(-110%); } to { transform: translateX(0); } }

#diag { position: fixed; left: 0; top: 82px; width: 1900px; max-height: 900px; overflow: hidden; z-index: 99;
        font: 12px/1.35 Consolas, monospace; color: #baffba; background: #000; padding: 8px; white-space: pre-wrap; display: none; }

#demoPanel {
  position: fixed; left: 8px; top: 86px; z-index: 100;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  font: 12px/1.2 Arial, Helvetica, sans-serif; color: #ccc; background: #222;
  border: 1px solid #444; border-radius: 4px; padding: 8px 12px;
}
#demoPanel label { display: flex; align-items: center; gap: 4px; }
#demoPanel input, #demoPanel select {
  font: 700 12px/1.2 Arial, Helvetica, sans-serif; color: #111; background: #fff;
  border: 1px solid #999; border-radius: 3px; padding: 3px 5px;
}
#flagDemoBtn {
  font: 700 13px/1.2 Arial, Helvetica, sans-serif; color: #fff; background: #333;
  border: 1px solid #555; border-radius: 4px; padding: 7px 12px; cursor: pointer; user-select: none;
}
#flagDemoBtn:hover { background: #444; }

/* team-colour underline beneath each team's block */
.underline { position: absolute; top: 69px; height: 3px; z-index: 6; }
#underlineAway { left: 34px;  width: 545px; background: var(--away) !important; }
#underlineHome { left: 579px; width: 545px; background: var(--home) !important; }

/* offscreen binding targets */
#bind { position: absolute; left: -99999px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
</style>
</head>

<script>
(function () {
  'use strict';

  var ART_W = 1844, ART_H = 76;
  var CANVAS_W = 1920, CANVAS_H = 79;
  var SCALE = CANVAS_W / ART_W;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- state ---------------- */

  var F = {
    awayName: 'MIAMI', awayRank: '6', awayRecord: '6-0', awayColor: '#DD6624',
    awayScore: '0', awayPossession: false, awayLogo: '',
    homeName: 'LOUISVILLE', homeRank: '', homeRecord: '2-1', homeColor: '#BB002F',
    homeScore: '0', homePossession: false, homeLogo: '',
    awayTimeouts: 3, homeTimeouts: 3,
    quarter: '1', clock: '15:00', playClock: '40', down: '1', distance: '10', downDistance: '',
    penaltyFlag: '', penaltyType: '', penaltyYards: ''
  };

  /* ---------------- alias table ---------------- */

  var ALIAS = {};
  function alias(field, ids) { ids.forEach(function (id) { ALIAS[id] = field; }); }

  alias('awayName',       ['away_name','away-name','awayTeam','awayTeamName','visitorName','team1Name','teamAName']);
  alias('awayRank',       ['away_rank','away-rank','awayTeamRank','team1Rank']);
  alias('awayRecord',     ['away_record','away-record','awayTeamRecord','team1Record']);
  alias('awayScore',      ['away_score','away-score','awayTeamScore','team1Score','visitorScore']);
  alias('awayColor',      ['awayColor','away_color','away-color','awayTeamColor','team1Color']);
  alias('awayLogo',       ['away_logo','away-logo','awayTeamLogo']);
  alias('awayPossession', ['away_possession','away-possession','awayPoss']);
  alias('awayTimeouts',   ['away_timeouts','away-timeouts','awayTO','awayTimeoutsLeft','team1Timeouts']);
  alias('homeName',       ['home_name','home-name','homeTeam','homeTeamName','team2Name','teamBName']);
  alias('homeRank',       ['home_rank','home-rank','homeTeamRank','team2Rank']);
  alias('homeRecord',     ['home_record','home-record','homeTeamRecord','team2Record']);
  alias('homeScore',      ['home_score','home-score','homeTeamScore','team2Score']);
  alias('homeColor',      ['homeColor','home_color','home-color','homeTeamColor','team2Color']);
  alias('homeLogo',       ['home_logo','home-logo','homeTeamLogo']);
  alias('homePossession', ['home_possession','home-possession','homePoss']);
  alias('homeTimeouts',   ['home_timeouts','home-timeouts','homeTO','homeTimeoutsLeft','team2Timeouts']);
  alias('possession',     ['possession']);
  alias('quarter',        ['period','qtr','quarter_text','gameQuarter','gamePeriod']);
  alias('clock',          ['gameClock','game_clock','game-clock','timeRemaining','clockText']);
  alias('playClock',      ['play_clock','play-clock','playClockText','shotClock']);
  alias('downDistance',   ['down_distance','down-distance','downAndDistance','situation']);
  alias('down',           ['down']);
  alias('distance',       ['distance']);
  alias('penaltyFlag',    ['penalty_flag','penalty-flag','flagTeam','flag_team','penaltyTeam','penalty_team']);
  alias('penaltyType',    ['penalty_type','penalty-type','penaltyText','penalty_name','foul','foulType','flagType']);
  alias('penaltyYards',   ['penalty_yards','penalty-yards','flagYards','yards','penaltyYds']);

  /* ---------------- formatting ---------------- */

  var ORD = { '1': '1ST', '2': '2ND', '3': '3RD', '4': '4TH' };

  function truthy(v) {
    if (typeof v === 'boolean') return v;
    var s = String(v).trim().toLowerCase();
    return s === 'true' || s === '1' || s === 'yes' || s === 'on';
  }

  function quarterText(v) {
    var q = String(v).trim().toUpperCase();
    if (!q) return '';
    if (q === '5' || q === 'OT') return 'OT';
    if (/^OT\d*$/.test(q)) return q;
    return ORD[q] || q;
  }

  function downDistanceText() {
    if (String(F.downDistance).trim()) return String(F.downDistance).toUpperCase();
    var d = String(F.down).trim(), dist = String(F.distance).trim().toUpperCase();
    if (!d && !dist) return '';
    var o = ORD[d] || d;
    return o ? (o + (dist ? ' & ' + dist : '')) : dist;
  }

  /* ---------------- type fitting ---------------- */

  function lineWidth(box) {
    var w = 0, n = 0, gap = parseFloat(getComputedStyle(box).columnGap) || 0;
    for (var i = 0; i < box.children.length; i++) {
      var r = box.children[i].getBoundingClientRect();
      if (r.width > 0) { w += r.width; n++; }
    }
    return w + gap * Math.max(0, n - 1);
  }

  function fit(box, els, max, min) {
    var list = els.filter(Boolean);
    if (!box || !list.length || !box.clientWidth) return;
    var size = max, guard = 0;
    var apply = function (v) { list.forEach(function (e) { e.style.fontSize = v + 'px'; }); };
    apply(size);
    while (lineWidth(box) / SCALE > box.clientWidth - 0.5 && size > min && guard++ < 400) {
      size -= 0.5;
      apply(size);
    }
  }

  function roll(el) {
    if (!el || !el.animate) return;
    el.animate([
      { transform: 'translateY(118%)', opacity: 0 },
      { transform: 'translateY(-11%)', opacity: 1, offset: .6 },
      { transform: 'translateY(2%)', offset: .82 },
      { transform: 'translateY(0)' }
    ], { duration: 520, easing: 'cubic-bezier(.25,.9,.3,1)' });
  }

  /* ---------------- render ---------------- */

  var quiet = false;
  var lastScore = { awayScore: null, homeScore: null };

  function text(id, v) { var el = $(id); if (el && el.textContent !== v) el.textContent = v; }

  // field -> the exact string paint() renders for it
  function expected() {
    return {
      awayName: String(F.awayName).toUpperCase(),
      homeName: String(F.homeName).toUpperCase(),
      awayRank: String(F.awayRank),
      homeRank: String(F.homeRank),
      awayRecord: String(F.awayRecord),
      homeRecord: String(F.homeRecord),
      awayScore: String(F.awayScore),

        lines.push(('#' + id).padEnd(17) +
          'txt="' + (el.textContent || '').slice(0, 22) + '"' +
          '  bg=' + c.backgroundColor + (c.backgroundImage !== 'none' ? '+img' : '') +
          '  disp=' + c.display + ' vis=' + c.visibility + ' op=' + c.opacity +
          (inline ? '  INLINE[' + inline.slice(0, 90) + ']' : ''));
      });

      var extra = [];
      Array.prototype.forEach.call($('bug').querySelectorAll('*'), function (el) {
        if (!el.id && el.getAttribute('style') && el.className !== 'shade') {
          var s = el.getAttribute('style');
          if (s.indexOf('background') !== -1 && extra.length < 8) extra.push(el.tagName + '.' + (el.className || '?') + '[' + s.slice(0, 60) + ']');
        }
      });
      if (extra.length) lines.push('OTHER   ' + extra.join(' | '));

      var globals = [];
      try {
        Object.keys(window).forEach(function (k) {
          if (globals.length >= 14) return;
          var v;
          try { v = window[k]; } catch (e) { return; }
          if (v && typeof v === 'object' && !(v instanceof Node) && v !== window) {
            try {
              var ks = Object.keys(v).slice(0, 6).join(',');
              if (/score|team|game|clock|quarter|down|home|away/i.test(k + ' ' + ks)) globals.push(k + '{' + ks + '}');
            } catch (e) {}
          }
        });
      } catch (e) {}
      lines.push('GLOBALS ' + (globals.join(' | ') || 'none matched'));
      lines.push('SOURCES adopted=' + sources.length);
      lines.push('STATE   ' + JSON.stringify(api.get()).slice(0, 400));
      if (log.length) lines.push('EVENTS\n  ' + log.slice(-8).join('\n  '));

      diag.textContent = lines.join('\n');
    };
    report();
    setInterval(report, 700);
  }

  paint();
  watch();
  var flagBtn = $('flagDemoBtn');
  if (flagBtn) flagBtn.addEventListener('click', function () { playFlagDemo(); });
  (function () {
    var wire = { dAwayName: 'awayName', dAwayRecord: 'awayRecord', dAwayScore: 'awayScore',
                 dHomeName: 'homeName', dHomeRecord: 'homeRecord', dHomeScore: 'homeScore',
                 dQuarter: 'quarter', dClock: 'clock', dPlayClock: 'playClock', dDownDistance: 'downDistance' };
    Object.keys(wire).forEach(function (id) {
      var el = $(id), field = wire[id];
      if (!el) return;
      el.value = F[field];
      el.addEventListener('input', function () { api.set(field, el.value); });
    });
    var poss = $('dPoss');
    if (poss) poss.addEventListener('change', function () { api.set('possession', poss.value || 'none'); });
  })();
  setInterval(pollSources, 120);
  setInterval(function () { if (harvest()) paint(); }, 500);
  api.rescan = function () { sources = []; lastSeen = ''; findSources(); pollSources(); };
  api.adopt = function (o) { if (o && typeof o === 'object') { sources.push(o); lastSeen = ''; pollSources(); } };
  api.sources = function () { return sources.length; };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
